name: Retrain Funda Models

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/retrain-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild features
        working-directory: .
        run: python src/features.py

      - name: Retrain models
        working-directory: .
        run: python src/models.py

      - name: Commit updated model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/funda_featured.csv models/
          if git diff --cached --quiet; then
            echo "No model artifact changes to commit."
          else
            git commit -m "Retrain models without target leakage"
            git push
          fi
